<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Wishlist - enext</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-[#95DBAE] selection:text-slate-900 bg-slate-50">
    <div id="header-placeholder"></div>

    <main class="min-h-screen pt-28 pb-16">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-6xl">
        <div class="flex items-center justify-between mb-8">
          <h1 class="text-3xl font-extrabold text-slate-900">My Wishlist</h1>
          <span class="text-slate-500 font-medium">2 Items</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
          <!-- Wishlist Item 1 -->
          <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 group hover:shadow-xl transition-all duration-500">
            <div class="relative aspect-square bg-slate-100 overflow-hidden">
              <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Product" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
              <button class="absolute top-4 right-4 w-10 h-10 bg-white rounded-full flex items-center justify-center text-red-500 shadow-lg hover:bg-red-50 transition-colors">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
              </button>
            </div>
            <div class="p-6">
              <div class="flex justify-between items-start mb-2">
                <div>
                  <h3 class="font-bold text-slate-900 text-lg">enext Watch Ultra</h3>
                  <p class="text-sm text-slate-500">Midnight Black</p>
                </div>
                <span class="text-xl font-extrabold text-slate-900">Nrs. 299</span>
              </div>
              <div class="flex gap-2 mt-6">
                <button class="flex-1 bg-[#95DBAE] text-black py-3 rounded-xl font-bold text-sm hover:scale-[1.02] transition-all">Add to Cart</button>
                <button class="w-12 h-12 bg-slate-100 rounded-xl flex items-center justify-center text-slate-500 hover:bg-slate-200 transition-colors">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Wishlist Item 2 -->
          <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 group hover:shadow-xl transition-all duration-500">
            <div class="relative aspect-square bg-slate-100 overflow-hidden">
              <img src="https://images.unsplash.com/photo-1610945661005-41f72df48b7b?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Product" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
              <button class="absolute top-4 right-4 w-10 h-10 bg-white rounded-full flex items-center justify-center text-red-500 shadow-lg hover:bg-red-50 transition-colors">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
              </button>
            </div>
            <div class="p-6">
              <div class="flex justify-between items-start mb-2">
                <div>
                  <h3 class="font-bold text-slate-900 text-lg">enext Vision Pro</h3>
                  <p class="text-sm text-slate-500">VR Headset</p>
                </div>
                <span class="text-xl font-extrabold text-slate-900">Nrs. 3,499</span>
              </div>
              <div class="flex gap-2 mt-6">
                <button class="flex-1 bg-[#95DBAE] text-black py-3 rounded-xl font-bold text-sm hover:scale-[1.02] transition-all">Add to Cart</button>
                <button class="w-12 h-12 bg-slate-100 rounded-xl flex items-center justify-center text-slate-500 hover:bg-slate-200 transition-colors">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Empty State Placeholder -->
        <div id="empty-wishlist" class="hidden text-center py-24 bg-white rounded-[3rem] shadow-sm border border-slate-100">
           <div class="w-24 h-24 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-6">
             <svg class="w-10 h-10 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
           </div>
           <h2 class="text-2xl font-bold text-slate-900 mb-2">Your wishlist is empty</h2>
           <p class="text-slate-500 mb-8 max-w-sm mx-auto">Save your favorite items here to keep track of what you want to buy later.</p>
           <a href="/pages/shop.html" class="inline-flex bg-[#95DBAE] text-black px-10 py-4 rounded-2xl font-bold hover:scale-105 transition-all shadow-lg shadow-[#95DBAE]/20">Explore Products</a>
        </div>
      </div>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
