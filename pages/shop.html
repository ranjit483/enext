<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop - enext</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-[#95DBAE] selection:text-slate-900 bg-slate-50">
    <div id="header-placeholder"></div>

    <main class="min-h-screen pt-24 pb-16">
      <!-- Shop Header -->
      <div class="bg-slate-900 text-white py-16 mb-8">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 text-center">
          <h1 class="text-4xl md:text-5xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-[#95DBAE] to-[#38BDF8]">Explore All Products</h1>
          <p class="text-slate-400 max-w-2xl mx-auto">Discover our full range of premium wearable electronics and smart living solutions designed for the future.</p>
        </div>
      </div>

      <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col lg:flex-row gap-8">
          
          <!-- Sidebar Filters -->
          <aside class="w-full lg:w-64 flex-shrink-0">
            <div class="glass p-6 rounded-2xl sticky top-24">
              <div class="flex items-center justify-between mb-6">
                <h2 class="text-lg font-bold text-slate-900">Filters</h2>
                <button class="text-sm text-[#1703F5] hover:underline">Clear All</button>
              </div>

              <!-- Price Filter -->
              <div class="mb-6">
                <h3 class="font-semibold text-slate-700 mb-3">Price Range</h3>
                <input type="range" class="w-full accent-[#1703F5]">
                <div class="flex justify-between text-sm text-slate-500 mt-2">
                  <span>Nrs. 0</span>
                  <span>Nrs. 1000+</span>
                </div>
              </div>

              <!-- Categories -->
              <div class="mb-6">
                <h3 class="font-semibold text-slate-700 mb-3">Categories</h3>
                <div class="space-y-2">
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="rounded text-[#1703F5] focus:ring-[#1703F5]" checked>
                    <span class="text-sm text-slate-600">Smartwatches (24)</span>
                  </label>
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="rounded text-[#1703F5] focus:ring-[#1703F5]">
                    <span class="text-sm text-slate-600">Smart Rings (8)</span>
                  </label>
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="rounded text-[#1703F5] focus:ring-[#1703F5]">
                    <span class="text-sm text-slate-600">VR Headsets (12)</span>
                  </label>
                </div>
              </div>

              <!-- Colors -->
              <div class="mb-6">
                <h3 class="font-semibold text-slate-700 mb-3">Color</h3>
                <div class="flex gap-2">
                  <button class="w-6 h-6 rounded-full bg-black ring-2 ring-offset-2 ring-slate-300"></button>
                  <button class="w-6 h-6 rounded-full bg-white border border-slate-200"></button>
                  <button class="w-6 h-6 rounded-full bg-[#1703F5]"></button>
                  <button class="w-6 h-6 rounded-full bg-[#95DBAE]"></button>
                </div>
              </div>
            </div>
          </aside>

          <!-- Product Grid -->
          <div class="flex-1">
            <!-- Toolbar -->
            <div class="flex flex-wrap items-center justify-between gap-4 mb-6 glass p-4 rounded-xl">
              <span class="text-sm text-slate-500">Showing 1-12 of 48 products</span>
              <div class="flex items-center gap-4 text-sm">
                <select class="bg-transparent border-none focus:ring-0 text-slate-700 font-medium outline-none cursor-pointer">
                  <option>Sort by: Featured</option>
                  <option>Price: Low to High</option>
                  <option>Price: High to Low</option>
                  <option>Newest Arrivals</option>
                </select>
                <div class="flex gap-2 border-l border-slate-200 pl-4">
                  <button class="text-[#1703F5]"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg></button>
                  <button class="text-slate-400 hover:text-slate-700"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path></svg></button>
                </div>
              </div>
            </div>

            <!-- Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
              <!-- Product Item -->
              <div class="bg-white rounded-2xl p-4 shadow-sm hover:shadow-xl transition-all duration-300 group relative">
                <div class="relative h-56 mb-4 rounded-xl overflow-hidden bg-slate-100 flex items-center justify-center">
                  <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Product" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                  <div class="absolute inset-0 bg-black/40 flex items-center justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button class="bg-white text-slate-900 p-2 rounded-full hover:bg-[#1703F5] hover:text-white transition-colors" title="Quick View"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg></button>
                    <button class="bg-white text-slate-900 p-2 rounded-full hover:bg-red-500 hover:text-white transition-colors" title="Wishlist"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg></button>
                  </div>
                </div>
                <h3 class="font-bold text-slate-900 mb-1"><a href="/pages/product.html">enext Watch Ultra</a></h3>
                <div class="flex items-center gap-1 mb-2 text-yellow-400 text-xs">
                  <span>★</span><span>★</span><span>★</span><span>★</span><span class="text-slate-300">★</span> <span class="text-slate-400 ml-1">(128)</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-lg font-extrabold text-[#1703F5]">Nrs. 299</span>
                  <button class="text-sm font-semibold bg-[#95DBAE] text-black px-4 py-2 rounded-lg hover:opacity-90 transition-colors">Add to Cart</button>
                </div>
              </div>
              
              <!-- Placeholder for more products -->
            </div>
            
            <!-- Pagination -->
            <div class="mt-12 flex justify-center">
              <nav class="flex gap-2">
                <button class="w-10 h-10 rounded-xl border border-slate-200 flex items-center justify-center text-slate-500 hover:border-[#1703F5] hover:text-[#1703F5] transition-colors">&lt;</button>
                <button class="w-10 h-10 rounded-xl bg-[#1703F5] text-white flex items-center justify-center font-bold shadow-lg shadow-[#1703F5]/30">1</button>
                <button class="w-10 h-10 rounded-xl border border-slate-200 flex items-center justify-center text-slate-700 hover:border-[#1703F5] hover:text-[#1703F5] transition-colors">2</button>
                <button class="w-10 h-10 rounded-xl border border-slate-200 flex items-center justify-center text-slate-700 hover:border-[#1703F5] hover:text-[#1703F5] transition-colors">3</button>
                <button class="w-10 h-10 rounded-xl border border-slate-200 flex items-center justify-center text-slate-500 hover:border-[#1703F5] hover:text-[#1703F5] transition-colors">&gt;</button>
              </nav>
            </div>

          </div>
        </div>
      </div>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
