<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart - enext</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-[#95DBAE] selection:text-slate-900 bg-slate-50">
    <div id="header-placeholder"></div>

    <main class="min-h-screen pt-28 pb-16">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-6xl">
        <h1 class="text-3xl font-extrabold text-slate-900 mb-8">Shopping Cart</h1>

        <div class="flex flex-col lg:flex-row gap-12">
          <!-- Cart Items List -->
          <div class="flex-1 space-y-6">
            <!-- Item 1 -->
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col sm:flex-row items-center gap-6">
              <div class="w-32 h-32 bg-slate-100 rounded-2xl flex items-center justify-center shrink-0 overflow-hidden">
                <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" alt="Product" class="w-full h-full object-cover">
              </div>
              <div class="flex-1 text-center sm:text-left">
                <h3 class="text-lg font-bold text-slate-900">enext Watch Ultra</h3>
                <p class="text-sm text-slate-500 mb-4">Midnight Black, 49mm</p>
                <div class="flex items-center justify-center sm:justify-start gap-4">
                  <div class="flex items-center bg-slate-100 rounded-xl px-2 h-10 w-32">
                    <button class="w-8 h-8 flex items-center justify-center text-slate-500 hover:text-slate-900 font-bold">-</button>
                    <input type="number" value="1" class="w-full bg-transparent border-none text-center font-bold text-slate-900 focus:ring-0 p-0">
                    <button class="w-8 h-8 flex items-center justify-center text-slate-500 hover:text-slate-900 font-bold">+</button>
                  </div>
                  <button class="text-red-500 hover:text-red-600 text-sm font-semibold transition-colors">Remove</button>
                </div>
              </div>
              <div class="text-xl font-extrabold text-slate-900">Nrs. 299.00</div>
            </div>

            <!-- Empty Cart State Placeholder (Hidden by default) -->
            <div id="empty-cart" class="hidden text-center py-20 bg-white rounded-3xl shadow-sm border border-slate-100">
               <svg class="w-20 h-20 text-slate-200 mx-auto mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
               <h2 class="text-2xl font-bold text-slate-900 mb-2">Your cart is empty</h2>
               <p class="text-slate-500 mb-8">Looks like you haven't added anything to your cart yet.</p>
               <a href="/pages/shop.html" class="bg-[#95DBAE] text-black px-8 py-3 rounded-xl font-bold hover:opacity-90 transition-all">Start Shopping</a>
            </div>
          </div>

          <!-- Order Summary Sidebar -->
          <div class="lg:w-1/3">
            <div class="bg-slate-900 rounded-3xl p-8 text-white sticky top-28 shadow-2xl">
              <h2 class="text-xl font-bold mb-8">Order Summary</h2>
              <div class="space-y-4 mb-8">
                <div class="flex justify-between text-slate-400">
                  <span>Subtotal</span>
                  <span class="text-white">Nrs. 299.00</span>
                </div>
                <div class="flex justify-between text-slate-400">
                  <span>Estimated Shipping</span>
                  <span class="text-white font-medium">Free</span>
                </div>
                <div class="flex justify-between text-slate-400">
                  <span>Estimated Tax</span>
                  <span class="text-white">Nrs. 24.99</span>
                </div>
              </div>
              <div class="border-t border-slate-800 pt-6 mb-8 flex justify-between items-center">
                <span class="text-lg font-bold">Total</span>
                <span class="text-2xl font-extrabold text-[#95DBAE]">Nrs. 323.99</span>
              </div>
              <a href="/pages/checkout.html" class="w-full bg-[#95DBAE] text-black py-4 rounded-xl font-bold flex items-center justify-center gap-2 hover:scale-[1.02] transition-all shadow-lg shadow-[#95DBAE]/20">
                Proceed to Checkout
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
              </a>
              <div class="mt-6 flex items-center justify-center gap-4 opacity-50">
                <img src="https://via.placeholder.com/30x20/ffffff/000000?text=V" alt="Visa" class="h-4">
                <img src="https://via.placeholder.com/30x20/ffffff/000000?text=M" alt="MasterCard" class="h-4">
                <img src="https://via.placeholder.com/30x20/ffffff/000000?text=P" alt="PayPal" class="h-4">
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
