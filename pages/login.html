<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - enext</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
  </head>
  <body class="antialiased selection:bg-[#95DBAE] selection:text-slate-900 bg-slate-50 flex items-center justify-center min-h-screen">
    
    <div class="absolute top-8 left-8 z-10">
      <a href="/" class="flex items-center gap-2">
        <span class="font-bold text-2xl tracking-tight text-slate-900"><span class="text-2xl text-[#95DBAE]">e</span>next</span>
      </a>
    </div>

    <!-- Abstract Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
      <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-[#95DBAE]/20 rounded-full mix-blend-multiply filter blur-3xl animate-pulse"></div>
      <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-emerald-200/20 rounded-full mix-blend-multiply filter blur-3xl animate-pulse" style="animation-delay: 2s;"></div>
    </div>

    <div class="w-full max-w-md px-4 py-8">
      <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-xl border border-white/50">
        <div class="text-center mb-8">
          <h1 class="text-2xl font-bold text-slate-900 mb-2">Welcome Back</h1>
          <p class="text-slate-500 text-sm">Enter your credentials to access your account.</p>
        </div>

        <form id="login-form" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
            <input id="email" type="email" placeholder="ranjitmanaraja@gmail.com" required class="w-full rounded-xl border border-slate-200 focus:border-[#95DBAE] focus:ring-[#95DBAE] focus:outline-none p-3 text-sm bg-slate-50">
          </div>
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-sm font-medium text-slate-700">Password</label>
              <a href="#" class="text-xs font-semibold text-blue-600 hover:text-blue-800 transition-colors">Forgot Password?</a>
            </div>
            <input id="password" type="password" placeholder="••••••••••••" required class="w-full rounded-xl border border-slate-200 focus:border-[#95DBAE] focus:ring-[#95DBAE] focus:outline-none p-3 text-sm bg-slate-50">
          </div>
          
          <div class="flex items-center">
            <input id="remember-me" type="checkbox" class="h-4 w-4 text-[#95DBAE] focus:ring-[#95DBAE] border-slate-300 rounded">
            <label for="remember-me" class="ml-2 block text-sm text-slate-600">Remember me</label>
          </div>

          <p id="error-message" class="text-red-500 text-sm hidden"></p>
          <p id="success-message" class="text-emerald-500 text-sm hidden font-bold">Login successful! Redirecting...</p>

          <button id="submit-btn" type="submit" class="w-full bg-[#95DBAE] hover:bg-emerald-400 text-slate-900 py-3 rounded-xl font-bold shadow-md transition-all flex justify-center items-center gap-2">
            Sign In
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
          </button>
        </form>

        <div class="mt-8 relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-200"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-white text-slate-500 rounded-full">Or continue with</span>
          </div>
        </div>

        <div class="mt-6 grid grid-cols-2 gap-4">
          <button class="flex items-center justify-center w-full px-4 py-2 border border-slate-200 rounded-xl shadow-sm text-sm font-medium text-slate-700 bg-white hover:bg-slate-50 transition-colors">
            <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Google
          </button>
          <button class="flex items-center justify-center w-full px-4 py-2 border border-slate-200 rounded-xl shadow-sm text-sm font-medium text-slate-700 bg-white hover:bg-slate-50 transition-colors">
            <svg class="w-5 h-5 mr-2 text-blue-600" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            Facebook
          </button>
        </div>

        <p class="mt-8 text-center text-sm text-slate-600">
          Don't have an account? 
          <a href="#" class="font-semibold text-blue-600 hover:underline">Sign up now</a>
        </p>
      </div>
    </div>

    <script>
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-message');
        const successMsg = document.getElementById('success-message');
        
        // Reset state
        errorMsg.classList.add('hidden');
        successMsg.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Signing in...';

        try {
          // MOCK LOGIN FOR SHARED HOSTING
          // Since Hostinger Shared Web Hosting doesn't support Node.js backends,
          // we are simulating the login process here so you can access the dashboard.
          
          await new Promise(r => setTimeout(r, 800)); // simulate network delay
          
          if (email === 'ranjitmanaraja@gmail.com' && password === '1234@manaR#') {
            // Mock successful login for Super Admin
            const mockUser = {
              id: 1,
              name: 'Manaraja Ranjit',
              email: 'ranjitmanaraja@gmail.com',
              role: 'superadmin'
            };
            
            localStorage.setItem('token', 'mock_jwt_token_12345');
            localStorage.setItem('user', JSON.stringify(mockUser));
            
            successMsg.classList.remove('hidden');
            
            setTimeout(() => {
              window.location.href = '/pages/admin.html';
            }, 1000);
            
          } else if (email === 'demo@user.com' && password === 'password') {
             // Mock standard user
             const mockUser = {
              id: 2,
              name: 'Demo User',
              email: 'demo@user.com',
              role: 'user'
            };
            
            localStorage.setItem('token', 'mock_jwt_token_67890');
            localStorage.setItem('user', JSON.stringify(mockUser));
            
            successMsg.classList.remove('hidden');
            
            setTimeout(() => {
              window.location.href = '/';
            }, 1000);
            
          } else {
            // Mock failed login
            errorMsg.textContent = 'Invalid email or password';
            errorMsg.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Sign In <svg class="w-4 h-4 ml-2 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>';
          }
        } catch (error) {
          errorMsg.textContent = 'Network error. Please make sure the backend is running.';
          errorMsg.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Sign In <svg class="w-4 h-4 ml-2 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>';
        }
      });
    </script>
  </body>
</html>
