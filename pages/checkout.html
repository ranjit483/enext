<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart & Checkout - enext</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-[#95DBAE] selection:text-slate-900 bg-slate-50">
    <div id="header-placeholder"></div>

    <main class="min-h-screen pt-28 pb-16">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-6xl">
        <h1 class="text-3xl font-bold text-slate-900 mb-8">Checkout</h1>

        <!-- Stepper -->
        <div class="flex items-center justify-between mb-12 relative max-w-2xl mx-auto">
          <div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-1 bg-slate-200 -z-10"></div>
          <div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/2 h-1 bg-[#1703F5] -z-10 transition-all"></div>
          
          <div class="flex flex-col items-center gap-2">
            <div class="w-10 h-10 rounded-full bg-[#1703F5] text-white flex items-center justify-center font-bold shadow-lg shadow-[#1703F5]/30"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg></div>
            <span class="text-xs font-semibold text-[#1703F5]">Shipping</span>
          </div>
          <div class="flex flex-col items-center gap-2">
            <div class="w-10 h-10 rounded-full bg-[#1703F5] text-white flex items-center justify-center font-bold shadow-lg shadow-[#1703F5]/30">2</div>
            <span class="text-xs font-semibold text-[#1703F5]">Payment</span>
          </div>
          <div class="flex flex-col items-center gap-2">
            <div class="w-10 h-10 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center font-bold border-2 border-white">3</div>
            <span class="text-xs font-medium text-slate-500">Review</span>
          </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-12">
          <!-- Left Column (Forms) -->
          <div class="lg:w-2/3">
            <div class="bg-white rounded-3xl p-8 shadow-sm mb-8">
              <h2 class="text-xl font-bold text-slate-900 mb-6">Payment Method</h2>
              
              <!-- Payment Options -->
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                <label class="relative cursor-pointer">
                  <input type="radio" name="payment" class="peer sr-only" checked>
                  <div class="p-4 rounded-xl border-2 border-slate-200 peer-checked:border-[#1703F5] peer-checked:bg-blue-50 transition-all flex flex-col items-center justify-center gap-2 h-24">
                    <svg class="w-8 h-8 text-slate-400 peer-checked:text-[#1703F5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                    <span class="text-sm font-semibold text-slate-700 peer-checked:text-[#1703F5]">Credit Card</span>
                  </div>
                  <div class="absolute top-2 right-2 w-4 h-4 rounded-full border-2 border-[#1703F5] bg-[#1703F5] flex items-center justify-center opacity-0 peer-checked:opacity-100 transition-opacity">
                    <div class="w-2 h-2 rounded-full bg-white"></div>
                  </div>
                </label>
                <label class="relative cursor-pointer">
                  <input type="radio" name="payment" class="peer sr-only">
                  <div class="p-4 rounded-xl border-2 border-slate-200 peer-checked:border-green-500 peer-checked:bg-green-50 transition-all flex flex-col items-center justify-center gap-2 h-24">
                    <span class="font-black text-xl text-green-600">eSewa</span>
                    <span class="text-sm font-semibold text-slate-700 peer-checked:text-green-700">Digital Wallet</span>
                  </div>
                  <div class="absolute top-2 right-2 w-4 h-4 rounded-full border-2 border-green-500 bg-green-500 flex items-center justify-center opacity-0 peer-checked:opacity-100 transition-opacity">
                    <div class="w-2 h-2 rounded-full bg-white"></div>
                  </div>
                </label>
                <label class="relative cursor-pointer">
                  <input type="radio" name="payment" class="peer sr-only">
                  <div class="p-4 rounded-xl border-2 border-slate-200 peer-checked:border-purple-500 peer-checked:bg-purple-50 transition-all flex flex-col items-center justify-center gap-2 h-24">
                    <span class="font-black text-xl text-purple-600">Khalti</span>
                    <span class="text-sm font-semibold text-slate-700 peer-checked:text-purple-700">Digital Wallet</span>
                  </div>
                  <div class="absolute top-2 right-2 w-4 h-4 rounded-full border-2 border-purple-500 bg-purple-500 flex items-center justify-center opacity-0 peer-checked:opacity-100 transition-opacity">
                    <div class="w-2 h-2 rounded-full bg-white"></div>
                  </div>
                </label>
              </div>

              <!-- Card Form -->
              <div class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Card Number</label>
                  <input type="text" placeholder="0000 0000 0000 0000" class="w-full rounded-xl border-slate-200 focus:border-[#1703F5] focus:ring-[#1703F5] p-3 text-sm">
                </div>
                <div class="flex gap-4">
                  <div class="w-1/2">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Expiry Date</label>
                    <input type="text" placeholder="MM/YY" class="w-full rounded-xl border-slate-200 focus:border-[#1703F5] focus:ring-[#1703F5] p-3 text-sm">
                  </div>
                  <div class="w-1/2">
                    <label class="block text-sm font-medium text-slate-700 mb-1">CVV</label>
                    <input type="text" placeholder="123" class="w-full rounded-xl border-slate-200 focus:border-[#1703F5] focus:ring-[#1703F5] p-3 text-sm">
                  </div>
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Name on Card</label>
                  <input type="text" placeholder="John Doe" class="w-full rounded-xl border-slate-200 focus:border-[#1703F5] focus:ring-[#1703F5] p-3 text-sm">
                </div>
              </div>
            </div>

            <div class="flex justify-between items-center">
              <button class="text-slate-500 hover:text-slate-900 font-medium px-4 py-2">&larr; Back to Shipping</button>
              <button class="bg-[#95DBAE] text-black px-8 py-3 rounded-xl font-bold shadow-lg shadow-black/10 transition-all">Review Order</button>
            </div>
          </div>

          <!-- Right Column (Order Summary) -->
          <div class="lg:w-1/3">
            <div class="bg-slate-900 rounded-3xl p-6 text-white sticky top-28">
              <h2 class="text-xl font-bold mb-6">Order Summary</h2>
              
              <!-- Cart Items -->
              <div class="space-y-4 mb-6">
                <div class="flex gap-4">
                  <div class="w-16 h-16 bg-white rounded-lg flex items-center justify-center shrink-0">
                    <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="Item" class="w-12 h-12 object-contain">
                  </div>
                  <div class="flex-1">
                    <h4 class="font-semibold text-sm">enext Watch Ultra</h4>
                    <p class="text-xs text-slate-400">Midnight Black, 49mm</p>
                    <div class="flex justify-between items-center mt-2">
                      <span class="text-sm font-medium text-slate-300">Qty: 1</span>
                      <span class="font-bold text-[#95DBAE]">Nrs. 299.00</span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Coupon -->
              <div class="mb-6 flex gap-2">
                <input type="text" placeholder="Discount code" class="w-full bg-slate-800 border-none rounded-lg text-sm focus:ring-2 focus:ring-[#95DBAE]">
                <button class="bg-slate-700 hover:bg-slate-600 px-4 rounded-lg text-sm font-semibold transition-colors">Apply</button>
              </div>

              <!-- Totals -->
              <div class="space-y-3 text-sm border-t border-slate-800 pt-6 mb-6">
                <div class="flex justify-between text-slate-400">
                  <span>Subtotal</span>
                  <span>Nrs. 299.00</span>
                </div>
                <div class="flex justify-between text-slate-400">
                  <span>Shipping</span>
                  <span>Free</span>
                </div>
                <div class="flex justify-between text-slate-400">
                  <span>Taxes</span>
                  <span>Nrs. 24.99</span>
                </div>
              </div>
              <div class="flex justify-between items-center border-t border-slate-800 pt-6">
                <span class="text-lg font-semibold">Total</span>
                <span class="text-2xl font-extrabold text-[#95DBAE]">Nrs. 323.99</span>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
